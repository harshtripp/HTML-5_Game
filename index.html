<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resident Raver - Minimal Standalone</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #333;
            flex-direction: column;
        }
        #gameCanvas {
            border: 2px solid #555;
            background-color: #222;
        }
        #status {
            color: white;
            font-family: monospace;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div id="status">Level 1 Loaded.</div>

    <script>
        // --- CONFIGURATION ---
        const GAME_WIDTH = 640;
        const GAME_HEIGHT = 480;
        const TILE_SIZE = 32; // Simulating the ImpactJS 16x16 tiles, scaled 2x
        const GRAVITY = 0.5;

        // --- GAME SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameState = {
            currentLevelIndex: 0,
            entities: [],
            player: null,
            input: { left: false, right: false, up: false },
            isGameOver: false
        };

        // --- LEVELS DATA (Mimics dorm1.js and dorm2.js structure) ---
        // '1' = Solid Platform
        const LevelData = [
            // Level 1 (dorm1.js simulation)
            {
                name: "Dormitory 1",
                playerStart: { x: 50, y: 400 },
                exitArea: { x: 550, y: 400, width: 40, height: 40 },
                platforms: [
                    // Floor
                    { x: 0, y: 440, width: GAME_WIDTH, height: TILE_SIZE },
                    // Elevated platform
                    { x: 150, y: 350, width: 150, height: TILE_SIZE }
                ],
                enemies: [
                    { type: 'Zombie', x: 200, y: 400, moveDist: 100 }
                ]
            },
            // Level 2 (dorm2.js simulation)
            {
                name: "Dormitory 2",
                playerStart: { x: 50, y: 400 },
                exitArea: { x: 550, y: 400, width: 40, height: 40 }, // Same exit for simplicity
                platforms: [
                    // Floor
                    { x: 0, y: 440, width: GAME_WIDTH, height: TILE_SIZE },
                    // Complex layout
                    { x: 100, y: 300, width: 100, height: TILE_SIZE },
                    { x: 300, y: 200, width: 100, height: TILE_SIZE },
                    { x: 450, y: 300, width: 100, height: TILE_SIZE },
                ],
                enemies: [
                    { type: 'Zombie', x: 480, y: 260, moveDist: 50 },
                    { type: 'Zombie', x: 150, y: 400, moveDist: 50 }
                ]
            }
        ];


        // --- ENTITY BASE CLASS (Mimics ig.Entity) ---
        class Entity {
            constructor(x, y, color = 'white', width = 16, height = 16) {
                this.pos = { x: x, y: y };
                this.vel = { x: 0, y: 0 };
                this.size = { w: width, h: height };
                this.color = color;
            }
            update(deltaTime) {
                // Base entities typically do nothing
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.pos.x, this.pos.y, this.size.w, this.size.h);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(this.pos.x, this.pos.y, this.size.w, this.size.h);
            }
        }


        // --- PLAYER ENTITY (Mimics entity-player.js) ---
        class Player extends Entity {
            constructor(x, y) {
                // Player uses 16x16 sprite size from PDF, scaled 2x to 32x32 for visibility
                super(x, y, '#00A8FF', TILE_SIZE, TILE_SIZE); 
                this.speed = 150; // pixels per second
                this.jumpVel = -200; // negative y is up
                this.isStanding = false;
            }

            update(deltaTime) {
                const dt = deltaTime / 1000; // Convert to seconds

                // 1. Apply Gravity (Velocity change)
                this.vel.y += GRAVITY * 1000 * dt; // Scale gravity

                // 2. Handle Input (Velocity change)
                this.vel.x = 0;
                if (gameState.input.left) {
                    this.vel.x = -this.speed;
                }
                if (gameState.input.right) {
                    this.vel.x = this.speed;
                }
                if (gameState.input.up && this.isStanding) {
                    this.vel.y = this.jumpVel;
                    this.isStanding = false;
                }

                // 3. Movement (Position change)
                this.pos.x += this.vel.x * dt;
                this.pos.y += this.vel.y * dt;

                // 4. Collision Detection (Simple AABB check with platforms)
                this.isStanding = false;
                LevelData[gameState.currentLevelIndex].platforms.forEach(p => {
                    if (this.checkCollision(p)) {
                        // Collision on the bottom (Landing)
                        if (this.vel.y > 0 && this.pos.y + this.size.h > p.y) {
                            this.pos.y = p.y - this.size.h;
                            this.vel.y = 0;
                            this.isStanding = true;
                        }
                        // Collision on the top (Hitting head)
                        else if (this.vel.y < 0 && this.pos.y < p.y + p.height) {
                            this.pos.y = p.y + p.height;
                            this.vel.y = 0;
                        }
                    }
                });

                // 5. Game Over (Falling off the screen)
                if (this.pos.y > GAME_HEIGHT) {
                    gameState.isGameOver = true;
                }
            }

            checkCollision(other) {
                // AABB (Axis-Aligned Bounding Box) collision check
                return this.pos.x < other.x + other.width &&
                       this.pos.x + this.size.w > other.x &&
                       this.pos.y < other.y + other.height &&
                       this.pos.y + this.size.h > other.y;
            }
            
            // Mimics kill() and gameOver() from main.js
            kill() {
                gameState.isGameOver = true;
            }
        }


        // --- ZOMBIE ENTITY (Mimics entity-zombie.js) ---
        class Zombie extends Entity {
            constructor(x, y, moveDist) {
                super(x, y, '#FF0000', TILE_SIZE, TILE_SIZE);
                this.start_x = x;
                this.speed = 40; // Slower speed
                this.moveDist = moveDist; // How far it walks
                this.direction = 1; // 1 = right, -1 = left
            }

            update(deltaTime) {
                const dt = deltaTime / 1000;

                // Simple walk-and-turn behavior
                this.pos.x += this.speed * this.direction * dt;

                // Turnaround logic
                if (this.pos.x > this.start_x + this.moveDist) {
                    this.direction = -1;
                } else if (this.pos.x < this.start_x - this.moveDist) {
                    this.direction = 1;
                }

                // Check collision with player (Mimics check() method)
                if (gameState.player && gameState.player.checkCollision(this)) {
                    gameState.player.kill();
                }
            }
        }


        // --- GAME CONTROL ---

        function loadLevel(index) {
            if (index >= LevelData.length) {
                document.getElementById('status').innerText = "Game Completed!";
                gameState.isGameOver = true;
                return;
            }
            
            gameState.currentLevelIndex = index;
            const level = LevelData[index];
            
            // Clear entities
            gameState.entities = [];
            
            // Create Player
            gameState.player = new Player(level.playerStart.x, level.playerStart.y);
            gameState.entities.push(gameState.player);

            // Create Enemies
            level.enemies.forEach(e => {
                if (e.type === 'Zombie') {
                    // Position zombie on the floor (y-40 for height and size)
                    gameState.entities.push(new Zombie(e.x, e.y, e.moveDist));
                }
            });

            gameState.isGameOver = false;
            document.getElementById('status').innerText = `Level ${index + 1}: ${level.name}`;
        }
        
        function handleLevelExit() {
            const exit = LevelData[gameState.currentLevelIndex].exitArea;
            const p = gameState.player;
            
            // Check if player is inside the exit area
            if (p.pos.x + p.size.w > exit.x &&
                p.pos.x < exit.x + exit.width &&
                p.pos.y + p.size.h > exit.y &&
                p.pos.y < exit.y + exit.height) 
            {
                // Trigger transition to next level
                loadLevel(gameState.currentLevelIndex + 1);
            }
        }

        function drawLevel(level) {
            // Draw Platforms (Background/Collision layer)
            level.platforms.forEach(p => {
                ctx.fillStyle = '#666';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = '#888';
                ctx.strokeRect(p.x, p.y, p.width, p.height);
            });
            
            // Draw Exit Area
            const exit = level.exitArea;
            ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
            ctx.fillRect(exit.x, exit.y, exit.width, exit.height);
        }

        // --- GAME LOOP ---
        let lastTime = 0;
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Clear the canvas
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (gameState.isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                
                ctx.fillStyle = 'white';
                ctx.font = '30px monospace';
                ctx.textAlign = 'center';
                
                if (gameState.currentLevelIndex >= LevelData.length) {
                    ctx.fillText("EXPERIMENT COMPLETE!", GAME_WIDTH / 2, GAME_HEIGHT / 2);
                    document.getElementById('status').innerText = "Game Completed! Refresh to restart.";
                } else {
                    ctx.fillText("GAME OVER - Press Space to Restart", GAME_WIDTH / 2, GAME_HEIGHT / 2);
                }
            } else {
                // 1. Update Entities
                gameState.entities.forEach(entity => entity.update(deltaTime));

                // 2. Handle Level Exit
                handleLevelExit();
                
                // 3. Draw Level and Entities
                drawLevel(LevelData[gameState.currentLevelIndex]);
                gameState.entities.forEach(entity => entity.draw());
            }

            requestAnimationFrame(gameLoop);
        }


        // --- INPUT HANDLER (Mimics ig.input.bind) ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') gameState.input.left = true;
            if (e.key === 'ArrowRight') gameState.input.right = true;
            if (e.key === 'ArrowUp' || e.key === ' ') {
                if (gameState.isGameOver && e.key === ' ') {
                    // Restart on space bar press if game over
                    loadLevel(0);
                }
                gameState.input.up = true;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') gameState.input.left = false;
            if (e.key === 'ArrowRight') gameState.input.right = false;
            if (e.key === 'ArrowUp' || e.key === ' ') gameState.input.up = false;
        });


        // --- START THE GAME ---
        loadLevel(0);
        gameLoop(0);

    </script>
</body>
</html>
